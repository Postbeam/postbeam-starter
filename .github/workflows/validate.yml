name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JSON files parse
        run: |
          for f in plugin.json .mcp.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            jq empty "$f"
            echo "ok: $f"
          done

      - name: Versions match and have a changelog entry
        run: |
          openai=$(jq -r '.version // empty' plugin.json)
          claude=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          market=$(jq -r '.plugins[] | select(.name == "postbeam-starter") | .version // empty' .claude-plugin/marketplace.json)
          echo "plugin.json: ${openai:-missing}"
          echo ".claude-plugin/plugin.json: ${claude:-missing}"
          echo ".claude-plugin/marketplace.json: ${market:-missing}"
          if [ -z "$claude" ] || [ "$claude" != "$market" ] || [ "$claude" != "$openai" ]; then
            echo "::error::version must be set and identical in plugin.json, .claude-plugin/plugin.json and .claude-plugin/marketplace.json"
            exit 1
          fi
          if ! grep -qF "## [$claude]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no entry for version $claude"
            exit 1
          fi

      - name: Connector addresses are production only
        run: |
          if grep -nEi 'ngrok|localhost|127\.0\.0\.1' .mcp.json; then
            echo "::error file=.mcp.json::.mcp.json must contain production addresses only"
            exit 1
          fi
          jq -e '.mcpServers.postbeam.url == "https://app.postbeam.ai/mcp"' .mcp.json > /dev/null

      - name: Skills have a name and a description
        run: |
          status=0
          for f in skills/*/SKILL.md; do
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "::error file=$f::file must start with frontmatter"
              status=1
              continue
            fi
            front=$(awk 'NR > 1 && $0 == "---" { exit } NR > 1 { print }' "$f")
            for key in name description; do
              if ! printf '%s\n' "$front" | grep -qE "^$key: *[^ ]"; then
                echo "::error file=$f::frontmatter is missing '$key'"
                status=1
              fi
            done
          done
          exit $status

      - name: Reference files named in a skill exist
        run: |
          status=0
          for f in skills/*/SKILL.md; do
            dir=$(dirname "$f")
            for ref in $({ grep -oE 'references/[A-Za-z0-9_.-]+\.md' "$f" || true; } | sort -u); do
              if [ ! -f "$dir/$ref" ]; then
                echo "::error file=$f::$ref is named but does not exist"
                status=1
              fi
            done
          done
          exit $status

      - name: npx skills finds the skill
        run: |
          npx --yes skills add . --list | tee skills-list.txt
          grep -q 'weekly-drafts' skills-list.txt

      - name: Claude Code plugin validation
        run: |
          npm install --global @anthropic-ai/claude-code
          if claude plugin validate --help > /dev/null 2>&1; then
            claude plugin validate .
          else
            echo "This Claude Code version has no 'plugin validate' command. Skipping."
          fi

      - name: ChatGPT listing fields fit the directory limits
        run: |
          jq -e '
            .["$schema"] == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"
            and (.name | test("^[a-z0-9]+(-[a-z0-9]+)*$")) and (.name | length) <= 64
            and (.extensions["com.openai"].interface as $i
              | ($i.displayName | length) > 0 and ($i.displayName | length) <= 30
              and ($i.shortDescription | length) > 0 and ($i.shortDescription | length) <= 30
              and ($i.longDescription | length) > 0 and ($i.longDescription | length) <= 4000
              and ($i.developerName | length) > 0 and ($i.developerName | length) <= 80
              and ($i.category | length) > 0
              and ($i.defaultPrompt | length) <= 3
              and ($i.defaultPrompt | all(length <= 128))
              and ([$i.websiteURL, $i.supportURL, $i.privacyPolicyURL, $i.termsOfServiceURL] | all(startswith("https://"))))
          ' plugin.json > /dev/null
          for key in onboardingSkill; do
            path=$(jq -r --arg k "$key" '.extensions["com.openai"][$k] // empty' plugin.json)
            test -f "$path" || { echo "::error file=plugin.json::$key points to a missing file: $path"; exit 1; }
          done
          for key in composerIcon logo; do
            path=$(jq -r --arg k "$key" '.extensions["com.openai"].interface[$k] // empty' plugin.json)
            test -f "$path" || { echo "::error file=plugin.json::$key points to a missing file: $path"; exit 1; }
          done
          echo "ok: plugin.json"

      - name: Build the ChatGPT package
        run: |
          version=$(jq -r '.version' plugin.json)
          mkdir -p dist
          zip -r -X "dist/postbeam-starter-$version.zip" plugin.json skills assets LICENSE README.md
          unzip -l "dist/postbeam-starter-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: postbeam-starter-chatgpt-package
          path: dist/*.zip
          if-no-files-found: error
