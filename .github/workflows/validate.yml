name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JSON files parse
        run: |
          for f in $(git ls-files '*.json'); do
            jq empty "$f"
            echo "ok: $f"
          done

      - name: Versions match and have a changelog entry
        run: |
          openai=$(jq -r '.version // empty' plugin.json)
          claude=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          echo "plugin.json: ${openai:-missing}"
          echo ".claude-plugin/plugin.json: ${claude:-missing}"
          if [ -z "$claude" ] || [ "$claude" != "$openai" ]; then
            echo "::error::version must be set and identical in plugin.json and .claude-plugin/plugin.json"
            exit 1
          fi
          if ! grep -qF "## [$claude]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no entry for version $claude"
            exit 1
          fi

      - name: Marketplace entry matches the Claude manifest
        run: |
          # The entry must carry the version, and agree with the manifest on every field both set.
          differs=$(jq -r --slurpfile m .claude-plugin/plugin.json '
            $m[0] as $manifest
            | .plugins[] | select(.source == "./") as $entry
            | (["version"] + ($entry | keys) | unique[]) as $key
            | select(($manifest | has($key)) and $manifest[$key] != $entry[$key])
            | $key
          ' .claude-plugin/marketplace.json)
          if [ -n "$differs" ]; then
            echo "::error file=.claude-plugin/marketplace.json::differs from .claude-plugin/plugin.json in:" $differs
            exit 1
          fi

      - name: Both listings use the same icon
        run: cmp .claude-plugin/icon.png assets/icon.png

      - name: Connector addresses are production only
        run: |
          if grep -nEi 'ngrok|localhost|127\.0\.0\.1' .mcp.json; then
            echo "::error file=.mcp.json::.mcp.json must contain production addresses only"
            exit 1
          fi
          jq -e '.mcpServers.postbeam.url == "https://app.postbeam.ai/mcp"' .mcp.json > /dev/null

      - name: Skills have a name and a description
        run: |
          status=0
          for f in skills/*/SKILL.md; do
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "::error file=$f::file must start with frontmatter"
              status=1
              continue
            fi
            front=$(awk 'NR > 1 && $0 == "---" { exit } NR > 1 { print }' "$f")
            for key in name description; do
              if ! printf '%s\n' "$front" | grep -qE "^$key: *[^ ]"; then
                echo "::error file=$f::frontmatter is missing '$key'"
                status=1
              fi
            done
          done
          exit $status

      - name: Reference files named in a skill exist
        run: |
          status=0
          for f in skills/*/SKILL.md; do
            dir=$(dirname "$f")
            for ref in $({ grep -oE 'references/[A-Za-z0-9_.-]+\.md' "$f" || true; } | sort -u); do
              if [ ! -f "$dir/$ref" ]; then
                echo "::error file=$f::$ref is named but does not exist"
                status=1
              fi
            done
          done
          exit $status

      - name: Bundled connectors are named in the connect steps
        run: |
          steps=skills/weekly-drafts/references/connect-tools.md
          for server in $(jq -r '.mcpServers | keys[] | select(. != "postbeam")' .mcp.json); do
            if ! grep -qF "\`$server\`" "$steps"; then
              echo "::error file=$steps::$server is in .mcp.json but not named here"
              exit 1
            fi
          done

      - name: npx skills finds the skill
        run: |
          npx --yes skills add . --list | tee skills-list.txt
          grep -q 'weekly-drafts' skills-list.txt

      - name: Claude Code plugin validation
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .

      - name: ChatGPT listing fields fit the directory limits
        run: |
          jq -e '
            def fits($max): length > 0 and length <= $max;
            .["$schema"] == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"
            and (.name | test("^[a-z0-9]+(-[a-z0-9]+)*$")) and (.name | length) <= 64
            and (.extensions["com.openai"].interface as $i
              | ($i.displayName | fits(30))
              and ($i.shortDescription | fits(30))
              and ($i.longDescription | fits(4000))
              and ($i.developerName | fits(80))
              and ($i.category | length) > 0
              and ($i.defaultPrompt | length) <= 3
              and ($i.defaultPrompt | all(length <= 128))
              and ([$i.websiteURL, $i.supportURL, $i.privacyPolicyURL, $i.termsOfServiceURL] | all(startswith("https://"))))
          ' plugin.json > /dev/null
          echo "ok: plugin.json"

      - name: Build the ChatGPT package and check it holds the files plugin.json points to
        run: |
          package="dist/postbeam-starter-$(jq -r '.version' plugin.json).zip"
          mkdir -p dist
          zip -r -X "$package" plugin.json skills assets LICENSE README.md
          unzip -l "$package"
          unzip -q "$package" -d dist/unpacked
          for path in $(jq -r '.extensions["com.openai"] | .onboardingSkill, .interface.composerIcon, .interface.logo' plugin.json); do
            test -f "dist/unpacked/$path" || { echo "::error file=plugin.json::points to a file that is not in the package: $path"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: postbeam-starter-chatgpt-package
          path: dist/*.zip
          if-no-files-found: error
